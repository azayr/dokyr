services:
  dokyr:
    image: ${DOKYR_IMAGE:-ghcr.io/azayr/dokyr:latest}
    restart: unless-stopped
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOKYR_HOST_PROC: /host/proc
      DOKYR_HOST_SYS: /host/sys
      DOKYR_HOST_DISK: /host/disk
      DATABASE_URL: postgres://selfhost:${POSTGRES_PASSWORD:-selfhost-local-password}@postgres:5432/selfhost?sslmode=disable
      DOKYR_JWT_SECRET: ${JWT_SECRET:-development-secret-change-before-production}
      DOKYR_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DOKYR_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8888}
      DOKYR_ENCRYPTION_KEY: ${ENCRYPTION_KEY:-development-encryption-key-change-now}
      DOKYR_BUILDKIT_HOST: ${DOKYR_BUILDKIT_HOST:-tcp://buildkit:1234}
      DOKYR_BUILDKIT_CACHE_REF: ${DOKYR_BUILDKIT_CACHE_REF:-}
      DOKYR_RAILPACK_FRONTEND: ${DOKYR_RAILPACK_FRONTEND:-ghcr.io/railwayapp/railpack-frontend:latest}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
      GITEA_CLIENT_ID: ${GITEA_CLIENT_ID:-}
      GITEA_CLIENT_SECRET: ${GITEA_CLIENT_SECRET:-}
      GITEA_BASE_URL: ${GITEA_BASE_URL:-https://gitea.com}
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Dokyr}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_NOTIFY_DEPLOYMENT_FAILURES: ${SMTP_NOTIFY_DEPLOYMENT_FAILURES:-true}
      SMTP_NOTIFY_DEPLOYMENT_SUCCESSES: ${SMTP_NOTIFY_DEPLOYMENT_SUCCESSES:-false}
      MAIL_STALWART_URL: ${MAIL_STALWART_URL:-http://stalwart:8080}
      MAIL_STALWART_API_KEY: ${MAIL_STALWART_API_KEY:-}
      MAIL_STALWART_USER: ${MAIL_STALWART_USER:-admin}
      MAIL_STALWART_PASSWORD: ${MAIL_STALWART_PASSWORD:-${STALWART_RECOVERY_PASSWORD:-dokyr-local-stalwart-password}}
      MAIL_STALWART_HOSTNAME: ${MAIL_STALWART_HOSTNAME:-}
      MAIL_STALWART_DEFAULT_DOMAIN: ${MAIL_STALWART_DEFAULT_DOMAIN:-}
      MAIL_STALWART_RELAY_HOST: ${MAIL_STALWART_RELAY_HOST:-stalwart}
      MAIL_STALWART_RELAY_PORT: ${MAIL_STALWART_RELAY_PORT:-465}
      MAIL_STALWART_RELAY_PASSWORD: ${MAIL_STALWART_RELAY_PASSWORD:-${STALWART_RELAY_PASSWORD:-dokyr-local-relay-password}}
      CADDY_ADMIN_URL: unix:///run/caddy-admin/admin.sock
      DOKYR_CONTROL_UPSTREAM: dokyr:8080
      DOKYR_CONTROL_HOSTS: ${CONTROL_HOSTS:-localhost}
      REGISTRY_HOSTS: ${REGISTRY_HOSTS:-registry.localhost:8888}
      REGISTRY_STORAGE: ${REGISTRY_STORAGE:-filesystem}
      REGISTRY_S3_REGION: ${REGISTRY_S3_REGION:-}
      REGISTRY_S3_BUCKET: ${REGISTRY_S3_BUCKET:-}
      REGISTRY_S3_ACCESSKEY: ${REGISTRY_S3_ACCESSKEY:-}
      REGISTRY_S3_SECRETKEY: ${REGISTRY_S3_SECRETKEY:-}
      REGISTRY_S3_ENDPOINT: ${REGISTRY_S3_ENDPOINT:-}
      REGISTRY_S3_FORCEPATHSTYLE: ${REGISTRY_S3_FORCEPATHSTYLE:-false}
      REGISTRY_S3_SECURE: ${REGISTRY_S3_SECURE:-true}
      REGISTRY_TOKEN_ISSUER: ${REGISTRY_TOKEN_ISSUER:-dokyr-registry}
      REGISTRY_TOKEN_SERVICE: ${REGISTRY_TOKEN_SERVICE:-dokyr-registry}
      REGISTRY_TOKEN_PRIVATE_KEY_PATH: /run/registry-auth/registry-token.key
      REGISTRY_TOKEN_CERTIFICATE_PATH: /run/registry-auth/registry-token.crt
      REGISTRY_INTERNAL_SECRET: ${REGISTRY_INTERNAL_SECRET:-${ENCRYPTION_KEY:-development-encryption-key-change-now}}
      DOKYR_PLATFORM_IMAGE: ${DOKYR_REGISTRY_IMAGE:-ghcr.io/azayr/dokyr}
      DOKYR_UPDATE_CHANNEL: ${DOKYR_UPDATE_CHANNEL:-latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ${HOST_DISK_PATH:-.}:/host/disk:ro
      - caddy_admin:/run/caddy-admin
      - registry_auth:/run/registry-auth
    networks: [control, proxy, build]
    depends_on:
      buildkit:
        condition: service_healthy
      caddy:
        condition: service_started
      postgres:
        condition: service_healthy
      stalwart:
        condition: service_started
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: selfhost
      POSTGRES_USER: selfhost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-selfhost-local-password}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30", "-c", "work_mem=2MB"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfhost -d selfhost"]
      interval: 3s
      timeout: 3s
      retries: 20

  stalwart:
    image: ${STALWART_IMAGE:-stalwartlabs/stalwart:v0.16}
    restart: unless-stopped
    environment:
      STALWART_RECOVERY_ADMIN: admin:${STALWART_RECOVERY_PASSWORD:-dokyr-local-stalwart-password}
      STALWART_HOSTNAME: ${STALWART_HOSTNAME:-}
      STALWART_PUBLIC_URL: ${STALWART_PUBLIC_URL:-}
    ports:
      - "${STALWART_SMTP_PORT:-25}:25"
      - "${STALWART_SUBMISSIONS_PORT:-465}:465"
      - "${STALWART_IMAPS_PORT:-993}:993"
      - "${STALWART_POP3S_PORT:-995}:995"
      - "${STALWART_SIEVE_PORT:-4190}:4190"
    volumes:
      - stalwart_config:/etc/stalwart
      - stalwart_data:/var/lib/stalwart
    networks: [control, mail_egress]
    security_opt: [no-new-privileges:true]

  registry:
    image: registry:3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$${REGISTRY_STORAGE:-filesystem}" = "s3" ]; then
          unset REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
        else
          unset REGISTRY_STORAGE_S3_REGION REGISTRY_STORAGE_S3_BUCKET REGISTRY_STORAGE_S3_ACCESSKEY REGISTRY_STORAGE_S3_SECRETKEY REGISTRY_STORAGE_S3_REGIONENDPOINT REGISTRY_STORAGE_S3_FORCEPATHSTYLE REGISTRY_STORAGE_S3_SECURE REGISTRY_STORAGE_S3_ENCRYPT
        fi
        for i in $$(seq 1 120); do
          [ -s /auth/registry-token.crt ] && break
          sleep 1
        done
        [ -s /auth/registry-token.crt ] || { echo "registry token certificate was not generated"; exit 1; }
        [ -n "$${REGISTRY_INTERNAL_SECRET:-}" ] || { echo "REGISTRY_INTERNAL_SECRET is required"; exit 1; }
        internal_registry_secret="$$(printf %s "$${REGISTRY_INTERNAL_SECRET}" | sha256sum | awk '{print $$1}')"
        cp /etc/distribution/config.yml /tmp/registry-config.yml
        {
          printf '\nnotifications:\n'
          printf '  endpoints:\n'
          printf '    - name: dokyr\n'
          printf '      url: http://dokyr:8080/api/registry/events\n'
          printf '      headers:\n'
          printf '        Authorization: ["Bearer %s"]\n' "$${internal_registry_secret}"
          printf '      timeout: 2s\n'
          printf '      threshold: 5\n'
          printf '      backoff: 2s\n'
          printf '      ignore:\n'
          printf '        actions: [pull, delete, mount]\n'
        } >> /tmp/registry-config.yml
        unset REGISTRY_INTERNAL_SECRET
        exec /entrypoint.sh /tmp/registry-config.yml
    environment:
      REGISTRY_AUTH: token
      REGISTRY_AUTH_TOKEN_REALM: ${PUBLIC_URL:-http://localhost:8888}/api/registry/token
      REGISTRY_AUTH_TOKEN_SERVICE: ${REGISTRY_TOKEN_SERVICE:-dokyr-registry}
      REGISTRY_AUTH_TOKEN_ISSUER: ${REGISTRY_TOKEN_ISSUER:-dokyr-registry}
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /auth/registry-token.crt
      REGISTRY_HTTP_RELATIVEURLS: "${REGISTRY_HTTP_RELATIVEURLS:-true}"
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE: ${REGISTRY_STORAGE:-filesystem}
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_S3_REGION: ${REGISTRY_S3_REGION:-}
      REGISTRY_STORAGE_S3_BUCKET: ${REGISTRY_S3_BUCKET:-}
      REGISTRY_STORAGE_S3_ACCESSKEY: ${REGISTRY_S3_ACCESSKEY:-}
      REGISTRY_STORAGE_S3_SECRETKEY: ${REGISTRY_S3_SECRETKEY:-}
      REGISTRY_STORAGE_S3_REGIONENDPOINT: ${REGISTRY_S3_ENDPOINT:-}
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: ${REGISTRY_S3_FORCEPATHSTYLE:-false}
      REGISTRY_STORAGE_S3_ENCRYPT: ${REGISTRY_S3_ENCRYPT:-false}
      REGISTRY_STORAGE_S3_SECURE: ${REGISTRY_S3_SECURE:-true}
      REGISTRY_INTERNAL_SECRET: ${REGISTRY_INTERNAL_SECRET:-${ENCRYPTION_KEY:-development-encryption-key-change-now}}
      OTEL_TRACES_EXPORTER: none
    volumes:
      - registry_data:/var/lib/registry
      - registry_auth:/auth:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [control, proxy]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOKYR_CONTROL_UPSTREAM: dokyr:8080
      DOKYR_CONTROL_HOSTS: ${CONTROL_HOSTS:-localhost}
      REGISTRY_HOSTS: ${REGISTRY_HOSTS:-registry.invalid}
    ports:
      - "${HTTP_PORT:-8888}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_admin:/run/caddy-admin
    networks: [control, proxy]

  buildkit:
    image: ${BUILDKIT_IMAGE:-moby/buildkit:buildx-stable-1}
    restart: unless-stopped
    privileged: true
    command: ["--config", "/etc/buildkit/buildkitd.toml", "--addr", "tcp://0.0.0.0:1234"]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    volumes:
      - buildkit_data:/var/lib/buildkit
      - ${DOKYR_INSTALL_DIR:-/opt/dokyr}/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
    networks: [build]
    healthcheck:
      test: ["CMD", "buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

networks:
  control:
    internal: true
  mail_egress:
  build:
  proxy:
    name: selfhost-proxy

volumes:
  buildkit_data:
  postgres_data:
  registry_data:
  caddy_data:
  caddy_config:
  caddy_admin:
  registry_auth:
  stalwart_config:
  stalwart_data:
