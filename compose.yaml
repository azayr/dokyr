services:
  dokyr:
    image: ${DOKYR_IMAGE:-ghcr.io/azayr/dokyr:latest}
    build: .
    restart: unless-stopped
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      SELFHOST_HOST_PROC: /host/proc
      SELFHOST_HOST_SYS: /host/sys
      SELFHOST_HOST_DISK: /host/disk
      DATABASE_URL: postgres://selfhost:${POSTGRES_PASSWORD:-selfhost-local-password}@postgres:5432/selfhost?sslmode=disable
      SELFHOST_JWT_SECRET: ${JWT_SECRET:-development-secret-change-before-production}
      SELFHOST_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SELFHOST_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8888}
      SELFHOST_ENCRYPTION_KEY: ${ENCRYPTION_KEY:-development-encryption-key-change-now}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Dokyr}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_NOTIFY_DEPLOYMENT_FAILURES: ${SMTP_NOTIFY_DEPLOYMENT_FAILURES:-true}
      SMTP_NOTIFY_DEPLOYMENT_SUCCESSES: ${SMTP_NOTIFY_DEPLOYMENT_SUCCESSES:-false}
      CADDY_ADMIN_URL: unix:///run/caddy-admin/admin.sock
      DOKYR_CONTROL_UPSTREAM: dokyr:8080
      SELFHOST_CONTROL_HOSTS: ${CONTROL_HOSTS:-localhost}
      REGISTRY_HOSTS: ${REGISTRY_HOSTS:-registry.localhost:8888}
      REGISTRY_STORAGE: ${REGISTRY_STORAGE:-filesystem}
      REGISTRY_S3_REGION: ${REGISTRY_S3_REGION:-}
      REGISTRY_S3_BUCKET: ${REGISTRY_S3_BUCKET:-}
      REGISTRY_S3_ACCESSKEY: ${REGISTRY_S3_ACCESSKEY:-}
      REGISTRY_S3_SECRETKEY: ${REGISTRY_S3_SECRETKEY:-}
      REGISTRY_S3_ENDPOINT: ${REGISTRY_S3_ENDPOINT:-}
      REGISTRY_S3_FORCEPATHSTYLE: ${REGISTRY_S3_FORCEPATHSTYLE:-false}
      REGISTRY_S3_SECURE: ${REGISTRY_S3_SECURE:-true}
      REGISTRY_TOKEN_ISSUER: ${REGISTRY_TOKEN_ISSUER:-dokyr-registry}
      REGISTRY_TOKEN_SERVICE: ${REGISTRY_TOKEN_SERVICE:-dokyr-registry}
      REGISTRY_TOKEN_PRIVATE_KEY_PATH: /run/registry-auth/registry-token.key
      REGISTRY_TOKEN_CERTIFICATE_PATH: /run/registry-auth/registry-token.crt
      SELFHOST_PLATFORM_IMAGE: ${DOKYR_REGISTRY_IMAGE:-ghcr.io/azayr/dokyr}
      SELFHOST_UPDATE_CHANNEL: ${DOKYR_UPDATE_CHANNEL:-latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ${HOST_DISK_PATH:-.}:/host/disk:ro
      - caddy_admin:/run/caddy-admin
      - registry_auth:/run/registry-auth
    networks: [control, proxy]
    depends_on:
      caddy:
        condition: service_started
      postgres:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: selfhost
      POSTGRES_USER: selfhost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-selfhost-local-password}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30", "-c", "work_mem=2MB"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfhost -d selfhost"]
      interval: 3s
      timeout: 3s
      retries: 20

  registry:
    image: registry:3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$${REGISTRY_STORAGE:-filesystem}" = "s3" ]; then
          unset REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
        else
          unset REGISTRY_STORAGE_S3_REGION REGISTRY_STORAGE_S3_BUCKET REGISTRY_STORAGE_S3_ACCESSKEY REGISTRY_STORAGE_S3_SECRETKEY REGISTRY_STORAGE_S3_REGIONENDPOINT REGISTRY_STORAGE_S3_FORCEPATHSTYLE REGISTRY_STORAGE_S3_SECURE REGISTRY_STORAGE_S3_ENCRYPT
        fi
        for i in $$(seq 1 120); do
          [ -s /auth/registry-token.crt ] && break
          sleep 1
        done
        [ -s /auth/registry-token.crt ] || { echo "registry token certificate was not generated"; exit 1; }
        exec /entrypoint.sh /etc/distribution/config.yml
    environment:
      REGISTRY_AUTH: token
      REGISTRY_AUTH_TOKEN_REALM: ${PUBLIC_URL:-http://localhost:8888}/api/registry/token
      REGISTRY_AUTH_TOKEN_SERVICE: ${REGISTRY_TOKEN_SERVICE:-dokyr-registry}
      REGISTRY_AUTH_TOKEN_ISSUER: ${REGISTRY_TOKEN_ISSUER:-dokyr-registry}
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /auth/registry-token.crt
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE: ${REGISTRY_STORAGE:-filesystem}
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_S3_REGION: ${REGISTRY_S3_REGION:-}
      REGISTRY_STORAGE_S3_BUCKET: ${REGISTRY_S3_BUCKET:-}
      REGISTRY_STORAGE_S3_ACCESSKEY: ${REGISTRY_S3_ACCESSKEY:-}
      REGISTRY_STORAGE_S3_SECRETKEY: ${REGISTRY_S3_SECRETKEY:-}
      REGISTRY_STORAGE_S3_REGIONENDPOINT: ${REGISTRY_S3_ENDPOINT:-}
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: ${REGISTRY_S3_FORCEPATHSTYLE:-false}
      REGISTRY_STORAGE_S3_ENCRYPT: ${REGISTRY_S3_ENCRYPT:-false}
      REGISTRY_STORAGE_S3_SECURE: ${REGISTRY_S3_SECURE:-true}
      OTEL_TRACES_EXPORTER: none
    volumes:
      - registry_data:/var/lib/registry
      - registry_auth:/auth:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [control, proxy]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOKYR_CONTROL_UPSTREAM: dokyr:8080
      SELFHOST_CONTROL_HOSTS: ${CONTROL_HOSTS:-localhost}
      REGISTRY_HOSTS: ${REGISTRY_HOSTS:-registry.invalid}
    ports:
      - "${HTTP_PORT:-8888}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_admin:/run/caddy-admin
    networks: [control, proxy]

networks:
  control:
    internal: true
  proxy:
    name: selfhost-proxy

volumes:
  postgres_data:
  registry_data:
  caddy_data:
  caddy_config:
  caddy_admin:
  registry_auth:
