name: Publish installer

on:
  push:
    branches:
      - main
    paths:
      - scripts/install.sh
      - scripts/update.sh
      - scripts/uninstall.sh
      - .github/workflows/publish-installer.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: installer-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare installer site
        run: |
          mkdir _site
          cp scripts/install.sh _site/install.sh
          cp scripts/install.sh _site/index.html
          cp scripts/update.sh _site/update.sh
          cp scripts/uninstall.sh _site/uninstall.sh
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload installer site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy installer site
        id: deployment
        uses: actions/deploy-pages@v4
